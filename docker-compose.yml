services:
  vllm:
    image: vllm/vllm-openai-cpu
    environment:
      - VLLM_CPU_KVCACHE_SPACE=2
      - OMP_NUM_THREADS=2
    command: >
      Qwen/Qwen2.5-0.5B-Instruct
      --max-model-len 2048
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 120s
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 6.5G

  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      - VLLM_URL=http://vllm:8000/v1/chat/completions
