services:
  vllm:
    image: vllm/vllm-openai-cpu
    command: >
      Qwen/Qwen2.5-0.5B-Instruct
      --max-model-len 2048
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    ports:
      - "8000:8000"

  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      - VLLM_URL=http://vllm:8000/v1/chat/completions
