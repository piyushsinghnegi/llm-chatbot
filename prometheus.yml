global:
  scrape_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']

  - job_name: 'fastapi'
    static_configs:
      - targets: ['api:8080']